# Large-Scale Depth Delusion Experiments
# Final Configuration: 12 models, 3 TPUs

# =============================================================================
# HARDWARE ALLOCATION
# =============================================================================

hardware_plan:
  v4_32:
    models: ["1B_shallow", "1B_medium", "1B_deep", "1B_vdeep", "1B_extreme", "3B_shallow", "3B_medium"]

  v4_32_secondary:
    models: ["3B_deep", "3B_vdeep", "3B_extreme"]

  v6e_64:
    models: ["7B_optimal", "7B_deep"]


# =============================================================================
# 1B SCALE (5 models on v4-32)
# Training: 20B tokens
# =============================================================================

1b_experiments:
  training:
    tokens: 20_000_000_000
    sequence_length: 2048
    batch_size_tokens: 524_288  # 512K
    learning_rate: 3e-4
    warmup_steps: 1000
    weight_decay: 0.1
    gradient_clip: 1.0
  
  models:
    - name: "1B_shallow"
      n_layers: 12
      d_model: 2560
      d_ff: 10240
      n_heads: 32
      params: 1_072_000_000
      
    - name: "1B_medium"
      n_layers: 24
      d_model: 1792
      d_ff: 7168
      n_heads: 32
      params: 1_014_000_000
      
    - name: "1B_deep"
      n_layers: 48
      d_model: 1280
      d_ff: 5120
      n_heads: 32
      params: 1_008_000_000
      
    - name: "1B_vdeep"
      n_layers: 64
      d_model: 1152
      d_ff: 4608
      n_heads: 32
      params: 1_069_000_000
      
    - name: "1B_extreme"
      n_layers: 80
      d_model: 1024
      d_ff: 4096
      n_heads: 32
      params: 1_058_000_000

# =============================================================================
# 3B SCALE (5 models split: 2 on v4-32, 3 on v5e-32)
# Training: 60B tokens
# =============================================================================

3b_experiments:
  training:
    tokens: 60_000_000_000
    sequence_length: 2048
    batch_size_tokens: 1_048_576  # 1M
    learning_rate: 2e-4
    warmup_steps: 1500
    weight_decay: 0.1
    gradient_clip: 1.0
  
  models:
    - name: "3B_shallow"
      n_layers: 16
      d_model: 3840
      d_ff: 15360
      n_heads: 32
      params: 3_018_000_000
      tpu_assignment: "v4_32"
      
    - name: "3B_medium"
      n_layers: 24
      d_model: 3072
      d_ff: 12288
      n_heads: 32
      params: 2,873,000,000
      tpu_assignment: "v4_32"
      
    - name: "3B_deep"
      n_layers: 40
      d_model: 2432
      d_ff: 9728
      n_heads: 32
      params: 3_029_000_000
      tpu_assignment: "v4_32_secondary"
      
    - name: "3B_vdeep"
      n_layers: 56
      d_model: 2048
      d_ff: 8192
      n_heads: 32
      params: 2_952_000_000
      tpu_assignment: "v4_32_secondary"
      
    - name: "3B_extreme"
      n_layers: 72
      d_model: 1792
      d_ff: 7168
      n_heads: 32
      params: 2,810,000,000
      tpu_assignment: "v4_32_secondary"

# =============================================================================
# 7B SCALE (2 models on v6e-64)
# Training: 140B tokens
# =============================================================================

7b_experiments:
  training:
    tokens: 140_000_000_000
    sequence_length: 2048
    batch_size_tokens: 2_097_152  # 2M
    learning_rate: 1.5e-4
    warmup_steps: 2000
    weight_decay: 0.1
    gradient_clip: 1.0
  
  models:
    - name: "7B_optimal"
      n_layers: 32
      d_model: 4096
      d_ff: 16384
      n_heads: 32
      params: 6_943_000_000
      purpose: "Near Dcrit - should perform well"
      
    - name: "7B_deep"
      n_layers: 64
      d_model: 2816
      d_ff: 11264
      n_heads: 32
      params: 6_443_000_000
      purpose: "Beyond Dcrit - should show Depth Delusion"

# =============================================================================
# SUCCESS CRITERIA
# =============================================================================

success_criteria:
  # Primary success metric: U-curve visible at each scale
  
  1b_scale:
    required:
      - "1B_medium (24L) achieves lowest loss"
      - "1B_vdeep (64L) loss > 1B_medium loss by ≥0.05"
      - "1B_extreme (80L) loss > 1B_shallow (12L) loss"
    strong:
      - "Clear U-curve when plotting loss vs depth"
      - "Optimal depth matches prediction: 24-32 layers"
      
  3b_scale:
    required:
      - "3B_medium (24L) achieves lowest loss"
      - "3B_extreme (72L) loss > 3B_shallow (16L) loss"
    strong:
      - "U-curve pattern matches 1B scale"
      - "Depth Delusion magnitude similar to 1B"
      
  7b_scale:
    required:
      - "7B_optimal (32L) loss < 7B_deep (64L) loss"
      - "Difference ≥ 0.10 (significant)"
    headline:
      - "64L < 32L at 7B scale (Llama/Mistral size)"
      - "This alone makes the paper undeniable"




